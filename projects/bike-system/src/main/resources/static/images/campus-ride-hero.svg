<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">清晨校园骑行插画</title>
  <desc id="desc">靛蓝色的校园清晨，远山、图书馆、树木与一名骑行者组成安静的通学路。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#e6f4ed"/>
      <stop offset="0.48" stop-color="#d6ecdf"/>
      <stop offset="1" stop-color="#f7f9f7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".62"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f4ea" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#f8f4ea" stop-opacity=".52"/>
      <stop offset="1" stop-color="#f8f4ea" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moon">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#eef5f7" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="fog" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <pattern id="grain" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".55" fill="#2a624a" opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1600" height="760" fill="url(#sky)"/>
  <circle cx="1240" cy="154" r="190" fill="url(#moon)" filter="url(#soft)"/>
  <circle cx="1240" cy="154" r="63" fill="#fbfaf5" opacity=".95"/>
  <circle cx="1212" cy="136" r="5" fill="#d9eee2" opacity=".7"/>
  <circle cx="1264" cy="172" r="8" fill="#d9eee2" opacity=".5"/>

  <g fill="#5f937a" opacity=".22">
    <circle cx="220" cy="104" r="1.6"/>
