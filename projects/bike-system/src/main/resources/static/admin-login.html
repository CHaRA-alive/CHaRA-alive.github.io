<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - 校园共享单车系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --admin-color: #28a745;
            --admin-secondary: #20c997;
            --operator-color: #ffc107;
        }

        body {
            background: linear-gradient(135deg, var(--admin-color) 0%, var(--admin-secondary) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo i {
            font-size: 3rem;
            color: var(--admin-color);
            margin-bottom: 15px;
        }

        .logo h1 {
            color: #333;
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .logo .subtitle {
            color: #666;
            font-size: 0.9rem;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: var(--admin-color);
            box-shadow: 0 0 0 3px rgba(40, 167, 69, 0.2);
        }

        .btn-login {
            background: linear-gradient(135deg, var(--admin-color) 0%, var(--admin-secondary) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(40, 167, 69, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .back-home {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 100;
            transition: color 0.3s;
        }

        .back-home:hover {
            color: #ffcc00;
            text-decoration: none;
        }

        .test-account {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-top: 25px;
            border-left: 4px solid var(--admin-color);
        }

        .test-account h6 {
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .test-item {
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .test-item strong {
            color: var(--admin-color);
            min-width: 80px;
            display: inline-block;
        }

        .alert {
            border-radius: 10px;
            border: none;
            padding: 12px 15px;
        }

        .role-hint {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            padding: 10px;
            background: rgba(40, 167, 69, 0.1);
            border-radius: 8px;
            font-size: 0.9rem;
            color: #155724;
        }

        .role-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .role-admin .role-icon {
            background: var(--admin-color);
            color: white;
        }

        .role-operator .role-icon {
            background: var(--operator-color);
            color: #333;
        }

        /* 加载动画 */
        .spinner-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* 响应式调整 */
        @media (max-width: 576px) {
            .login-container {
                padding: 30px 20px;
                margin: 20px;
            }

            .back-home {
                top: 15px;
                left: 15px;
            }

            .logo i {
                font-size: 2.5rem;
            }

            .logo h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
<a href="/index.html" class="back-home">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
    </svg>
    返回首页
</a>

<div class="login-container">
    <div class="logo">
        <i class="fas fa-user-shield"></i>
        <h1>管理后台登录</h1>
        <p class="subtitle">系统管理员 & 运维人员</p>
    </div>

    <form id="loginForm">
        <div class="mb-3">
            <label for="adminId" class="form-label fw-bold">管理员ID</label>
            <input type="text" class="form-control" id="adminId"
                   placeholder="请输入管理员ID" required
                   oninput="showRoleHint(this.value)">
            <div class="form-text">
                <i class="fas fa-info-circle me-1"></i>
                以 A 开头为系统管理员，以 O 开头为运维人员
            </div>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label fw-bold">密码（手机号）</label>
            <input type="password" class="form-control" id="password"
                   placeholder="请输入手机号作为密码" required>
            <div class="form-text">
                <i class="fas fa-mobile-alt me-1"></i>
                使用注册时填写的手机号作为密码
            </div>
        </div>

        <!-- 角色提示 -->
        <div id="roleHint" class="d-none">
            <div class="role-hint role-admin d-none" id="adminHint">
                <div class="role-icon">
                    <i class="fas fa-user-shield fa-sm"></i>
                </div>
                <span>系统管理员 - 拥有系统所有管理权限</span>
            </div>
            <div class="role-hint role-operator d-none" id="operatorHint">
                <div class="role-icon">
                    <i class="fas fa-tools fa-sm"></i>
                </div>
                <span>运维人员 - 负责车辆维护、调度和清洁</span>
            </div>
        </div>

        <button type="submit" class="btn btn-login" id="loginBtn">
            <span id="loginText">登录管理后台</span>
            <span id="loginSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
        </button>

        <div class="alert alert-danger mt-3 d-none" id="errorAlert"></div>
    </form>

    <!-- 测试账号区域 -->
    <div class="test-account">
        <h6><i class="fas fa-vial me-2"></i>测试账号</h6>

        <div class="test-item">
            <strong>系统管理员:</strong>
            <span>ID: A000000001 | 密码: 13900139001</span>
        </div>

        <div class="test-item">
            <strong>运维人员:</strong>
            <span>ID: O000000001 | 密码: 13900139002</span>
        </div>

        <div class="test-item">
            <strong>运维人员:</strong>
            <span>ID: O000000002 | 密码: 13900139003</span>
        </div>

        <div class="mt-3">
            <button class="btn btn-sm btn-outline-success w-100" onclick="fillTestAccount('admin')">
                填入管理员测试账号
            </button>
            <button class="btn btn-sm btn-outline-warning w-100 mt-2" onclick="fillTestAccount('operator')">
                填入运维测试账号
            </button>
        </div>
    </div>

    <!-- 角色说明 -->
    <div class="role-hint mt-3">
        <i class="fas fa-lightbulb text-warning"></i>
        <span>
                系统管理员（A开头）：管理用户、车辆、订单等所有数据<br>
                运维人员（O开头）：处理车辆维修、清洁、调度等任务
            </span>
    </div>
</div>

<script>
    // 页面加载完成
    document.addEventListener('DOMContentLoaded', function() {
        // 检查是否已有登录状态
        const userType = localStorage.getItem('userType');
        if (userType === 'admin') {
            // 如果已经登录，显示欢迎信息
            const adminId = localStorage.getItem('adminId');
            const adminName = localStorage.getItem('adminName');
            if (adminId && adminName) {
                document.getElementById('adminId').value = adminId;
                showRoleHint(adminId);
            }
        }
    });

    // 显示角色提示
    function showRoleHint(adminId) {
        const roleHint = document.getElementById('roleHint');
        const adminHint = document.getElementById('adminHint');
        const operatorHint = document.getElementById('operatorHint');

        if (!adminId || adminId.trim() === '') {
            roleHint.classList.add('d-none');
            adminHint.classList.add('d-none');
            operatorHint.classList.add('d-none');
            return;
        }

        roleHint.classList.remove('d-none');

        if (adminId.toUpperCase().startsWith('A')) {
            adminHint.classList.remove('d-none');
            operatorHint.classList.add('d-none');
        } else if (adminId.toUpperCase().startsWith('O')) {
            adminHint.classList.add('d-none');
            operatorHint.classList.remove('d-none');
        } else {
            roleHint.classList.add('d-none');
        }
    }

    // 表单提交处理
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const adminId = document.getElementById('adminId').value.trim();
        const password = document.getElementById('password').value.trim();

        // 验证输入
        if (!adminId || !password) {
            showError('请填写管理员ID和密码');
            return;
        }

        if (password.length !== 11 || !/^1[3-9]\d{9}$/.test(password)) {
            showError('请输入11位有效的手机号作为密码');
            return;
        }

        // 显示加载状态
        const loginBtn = document.getElementById('loginBtn');
        const loginText = document.getElementById('loginText');
        const loginSpinner = document.getElementById('loginSpinner');

        loginText.textContent = '登录中...';
        loginSpinner.classList.remove('d-none');
        loginBtn.disabled = true;

        try {
            // 调用后端API
            const response = await fetch('/api/auth/admin/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                    'adminId': adminId,
                    'phone': password
                })
            });

            const data = await response.json();

            if (data.success) {
                // 保存登录信息
                localStorage.setItem('adminId', data.admin.adminId);
                localStorage.setItem('adminName', data.admin.adminName);
                localStorage.setItem('adminPhone', data.admin.adminPhone);
                localStorage.setItem('userType', 'admin');
                localStorage.setItem('role', data.role || 'admin');
                localStorage.setItem('displayName', data.displayName || data.admin.adminName);

                // 显示成功消息
                showSuccess(`欢迎回来，${data.admin.adminName}！`);

                // 延迟跳转
                setTimeout(() => {
                    if (data.role === 'operator') {
                        // 运维人员跳转到运维页面
                        window.location.href = 'operator-dashboard.html';
                    } else {
                        // 系统管理员跳转到管理后台
                        window.location.href = 'admin-dashboard.html';
                    }
                }, 1500);

            } else {
                throw new Error(data.message || '登录失败');
            }
        } catch (error) {
            showError(error.message);
        } finally {
            loginText.textContent = '登录管理后台';
            loginSpinner.classList.add('d-none');
            loginBtn.disabled = false;
        }
    });

    // 显示错误信息
    function showError(message) {
        const errorAlert = document.getElementById('errorAlert');
        errorAlert.innerHTML = `
            <div class="d-flex align-items-center">
                <i class="fas fa-exclamation-circle me-2"></i>
                <span>${message}</span>
            </div>
        `;
        errorAlert.classList.remove('d-none');

        // 5秒后自动隐藏
        setTimeout(() => {
            errorAlert.classList.add('d-none');
        }, 5000);
    }

    // 显示成功信息
    function showSuccess(message) {
        const errorAlert = document.getElementById('errorAlert');
        errorAlert.innerHTML = `
            <div class="d-flex align-items-center">
                <i class="fas fa-check-circle me-2 text-success"></i>
                <span class="text-success">${message}</span>
            </div>
        `;
        errorAlert.classList.remove('d-none');
        errorAlert.classList.remove('alert-danger');
        errorAlert.classList.add('alert-success');
    }

    // 填入测试账号
    function fillTestAccount(type) {
        const adminIdInput = document.getElementById('adminId');
        const passwordInput = document.getElementById('password');

        if (type === 'admin') {
            adminIdInput.value = 'A000000001';
            passwordInput.value = '13900139001';
        } else if (type === 'operator') {
            adminIdInput.value = 'O000000001';
            passwordInput.value = '13900139002';
        }

        // 触发角色提示
        showRoleHint(adminIdInput.value);

        // 聚焦到密码输入框
        passwordInput.focus();
    }

    // 实时显示角色提示
    document.getElementById('adminId').addEventListener('input', function(e) {
        showRoleHint(e.target.value);
    });
</script>

<!-- Font Awesome -->
<script src="https://kit.fontawesome.com/a076d05399.js"></script>
</body>
</html>
