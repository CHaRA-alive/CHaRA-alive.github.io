<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f5e45">
  <title>青骑智行 · 工作台</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/rider.css">
</head>
<body>
  <div class="console-shell" id="console-shell">
    <aside class="console-sidebar" id="console-sidebar"></aside>
    <div class="console-main">
      <header class="console-topbar">
        <button class="icon-btn mobile-menu-btn" id="mobile-menu" aria-label="打开菜单">
          <span data-icon="menu"></span>
        </button>
        <div class="breadcrumb">
          <span>青骑智行</span>
          <span>/</span>
          <strong id="breadcrumb-current">工作台</strong>
        </div>
        <div class="topbar-right">
          <span class="live-clock" id="live-clock">--</span>
          <button class="icon-btn" id="refresh-view" title="刷新当前数据" aria-label="刷新当前数据">
            <span data-icon="refresh"></span>
          </button>
          <button class="icon-btn" id="top-logout" title="退出登录" aria-label="退出登录">
            <span data-icon="logout"></span>
          </button>
        </div>
      </header>
      <main class="console-view view-enter" id="console-view">
        <div class="loading-panel"><div><span class="spinner"></span><span>正在读取业务数据...</span></div></div>
      </main>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/console.js"></script>
</body>
</html>
