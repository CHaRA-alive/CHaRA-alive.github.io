<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - 校园共享单车系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo i {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 15px;
        }
        .logo h1 {
            color: #333;
            font-size: 1.8rem;
            font-weight: bold;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        .footer-links {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
        .footer-links a {
            color: #667eea;
            text-decoration: none;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }
        .back-home {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .back-home:hover {
            color: #ffcc00;
        }
        .test-account {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            border-left: 4px solid #667eea;
        }
    </style>
</head>
<body>
<a href="/index.html" class="back-home">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
    </svg>
    返回首页
</a>

<div class="login-container">
    <div class="logo">
        <i class="fas fa-bicycle"></i>
        <h1>用户登录</h1>
        <p class="text-muted">请使用您的学号登录系统</p>
    </div>

    <form id="loginForm">
        <div class="mb-3">
            <label for="userId" class="form-label">学号/用户ID</label>
            <input type="text" class="form-control" id="userId"
                   placeholder="请输入学号或用户ID" required>
            <div class="form-text">示例：U001 或 3124002994</div>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">密码（手机号）</label>
            <input type="password" class="form-control" id="password"
                   placeholder="请输入手机号作为密码" required>
            <div class="form-text">密码为注册时使用的手机号</div>
        </div>

        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe">
            <label class="form-check-label" for="rememberMe">记住我</label>
        </div>

        <button type="submit" class="btn btn-login" id="loginBtn">
            <span id="loginText">登录</span>
            <span id="loginSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
        </button>

        <div class="alert alert-danger mt-3 d-none" id="errorAlert"></div>
    </form>

    <div class="test-account">
        <h6><i class="fas fa-vial"></i> 测试账号</h6>
        <p class="mb-1"><strong>用户ID:</strong> U001</p>
        <p class="mb-1"><strong>密码:</strong> 13800138000</p>
        <button class="btn btn-sm btn-outline-primary mt-2" onclick="fillTestAccount()">
            使用测试账号
        </button>
    </div>

    <div class="footer-links">
        <p>还没有账号？<a href="#" onclick="showRegister()">立即注册</a></p>
        <p><a href="#" onclick="showForgetPassword()">忘记密码？</a></p>
    </div>
</div>

<script>
    // 表单提交处理
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const userId = document.getElementById('userId').value;
        const password = document.getElementById('password').value;

        // 显示加载状态
        const loginBtn = document.getElementById('loginBtn');
        const loginText = document.getElementById('loginText');
        const loginSpinner = document.getElementById('loginSpinner');

        loginText.textContent = '登录中...';
        loginSpinner.classList.remove('d-none');
        loginBtn.disabled = true;

        try {
            // 调用真实的后端API
            const response = await fetch('/api/auth/user/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                    'userId': userId,
                    'phone': password
                })
            });

            const data = await response.json();

            if (data.success) {
                // 保存用户信息到localStorage
                localStorage.setItem('userId', data.user.userId);
                localStorage.setItem('userName', data.user.userName || '用户');
                localStorage.setItem('studentId', data.user.studentId || userId);
                localStorage.setItem('phone', data.user.phone || password);
                localStorage.setItem('creditScore', data.user.creditScore || 100);
                localStorage.setItem('userType', 'user');

                // 登录成功后跳转
                setTimeout(() => {
                    window.location.href = 'user-dashboard.html';
                }, 1000);
            } else {
                throw new Error(data.message || '登录失败');
            }

        } catch (error) {
            showError(error.message);
        } finally {
            loginText.textContent = '登录';
            loginSpinner.classList.add('d-none');
            loginBtn.disabled = false;
        }
    });

    function showError(message) {
        const errorAlert = document.getElementById('errorAlert');
        errorAlert.textContent = message;
        errorAlert.classList.remove('d-none');
        setTimeout(() => errorAlert.classList.add('d-none'), 5000);
    }

    function fillTestAccount() {
        document.getElementById('userId').value = 'U001';
        document.getElementById('password').value = '13800138000';
    }

    function showRegister() {
        alert('注册功能正在开发中，请联系管理员添加账号');
    }

    function showForgetPassword() {
        alert('密码即为手机号，请使用注册时填写的手机号登录');
    }
</script>
<!-- Font Awesome -->
<script src="https://kit.fontawesome.com/a076d05399.js"></script>
</body>
</html>
