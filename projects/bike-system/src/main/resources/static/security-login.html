<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安保人员登录 - 校园共享单车系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #dc3545 0%, #e83e8c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo i {
            font-size: 3rem;
            color: #dc3545;
            margin-bottom: 15px;
        }
        .logo h1 {
            color: #333;
            font-size: 1.8rem;
            font-weight: bold;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        .form-control:focus {
            border-color: #dc3545;
            box-shadow: 0 0 0 3px rgba(220, 53, 69, 0.2);
        }
        .btn-login {
            background: linear-gradient(135deg, #dc3545 0%, #e83e8c 100%);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(220, 53, 69, 0.4);
        }
        .back-home {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .test-account {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            border-left: 4px solid #dc3545;
        }
    </style>
</head>
<body>
<a href="/index.html" class="back-home">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
    </svg>
    返回首页
</a>

<div class="login-container">
    <div class="logo">
        <i class="fas fa-shield-alt"></i>
        <h1>安保人员登录</h1>
        <p class="text-muted">安全监控与违规处理</p>
    </div>

    <form id="loginForm">
        <div class="mb-3">
            <label for="securityId" class="form-label">安保人员ID</label>
            <input type="text" class="form-control" id="securityId"
                   placeholder="请输入安保人员ID" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">密码（手机号）</label>
            <input type="password" class="form-control" id="password"
                   placeholder="请输入手机号作为密码" required>
        </div>

        <button type="submit" class="btn btn-login" id="loginBtn">
            <span id="loginText">登录安保系统</span>
            <span id="loginSpinner" class="spinner-border spinner-border-sm d-none"></span>
        </button>

        <div class="alert alert-danger mt-3 d-none" id="errorAlert"></div>
    </form>

    <div class="test-account">
        <h6><i class="fas fa-vial"></i> 测试账号</h6>
        <p class="mb-1"><strong>安保ID:</strong> S001</p>
        <p class="mb-1"><strong>密码:</strong> 13800138000</p>
        <button class="btn btn-sm btn-outline-danger mt-2" onclick="fillTestAccount()">
            使用测试账号
        </button>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const securityId = document.getElementById('securityId').value;
        const password = document.getElementById('password').value;

        // 显示加载
        const loginBtn = document.getElementById('loginBtn');
        const loginText = document.getElementById('loginText');
        const loginSpinner = document.getElementById('loginSpinner');

        loginText.textContent = '登录中...';
        loginSpinner.classList.remove('d-none');
        loginBtn.disabled = true;

        try {
            // 调用后端安保人员登录API
            const response = await fetch('/api/auth/security/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                    'securityId': securityId,
                    'phone': password
                })
            });

            const data = await response.json();

            if (data.success) {
                // 保存安保人员信息
                localStorage.setItem('securityId', data.securityPerson.secId);
                localStorage.setItem('securityName', data.securityPerson.secName || '安保人员');
                localStorage.setItem('userType', 'security');

                // 跳转到安保系统
                setTimeout(() => {
                    window.location.href = 'security-dashboard.html';
                }, 1000);
            } else {
                throw new Error(data.message || '登录失败');
            }
        } catch (error) {
            showError(error.message);
        } finally {
            loginText.textContent = '登录安保系统';
            loginSpinner.classList.add('d-none');
            loginBtn.disabled = false;
        }
    });

    function showError(message) {
        const errorAlert = document.getElementById('errorAlert');
        errorAlert.textContent = message;
        errorAlert.classList.remove('d-none');
        setTimeout(() => errorAlert.classList.add('d-none'), 5000);
    }

    function fillTestAccount() {
        document.getElementById('securityId').value = 'S001';
        document.getElementById('password').value = '13800138000';
    }
</script>
<script src="https://kit.fontawesome.com/a076d05399.js"></script>
</body>
</html>
